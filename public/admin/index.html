<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Locanda Blues · Pannello di gestione</title>
    <style>
      /* ──────────────────────────────────────────────────────────────
         Solo lo stile del bottone Guida flottante. Il resto del tema
         (Notion/Apple light) viene iniettato da JS dopo che Decap
         monta i suoi stili — è l'unico modo per vincere emotion.
         ────────────────────────────────────────────────────────────── */
      #guida-fab {
        position: fixed; bottom: 22px; right: 22px; z-index: 99999;
        background: #8B1A1A; color: #fff; text-decoration: none;
        padding: 11px 18px; border-radius: 999px; font-weight: 500;
        font-size: 13.5px; letter-spacing: -0.005em;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
        box-shadow: 0 4px 12px rgba(139, 26, 26, 0.22), 0 1px 2px rgba(0,0,0,0.05);
        display: flex; align-items: center; gap: 7px;
        transition: background-color 0.18s cubic-bezier(0.22, 1, 0.36, 1),
                    transform 0.18s cubic-bezier(0.22, 1, 0.36, 1),
                    box-shadow 0.18s cubic-bezier(0.22, 1, 0.36, 1);
      }
      #guida-fab:hover {
        background: #6B0F0F;
        transform: translateY(-1px);
        box-shadow: 0 8px 20px rgba(139, 26, 26, 0.28), 0 2px 4px rgba(0,0,0,0.08);
      }
      #guida-fab:active { transform: translateY(0); }
    </style>
  </head>
  <body>
    <a id="guida-fab" href="/guida-admin" target="_blank" rel="noopener" title="Apri la guida al pannello">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17h-2v-2h2v2zm2.07-7.75l-.9.92C13.45 12.9 13 13.5 13 15h-2v-.5c0-1.1.45-2.1 1.17-2.83l1.24-1.26c.37-.36.59-.86.59-1.41 0-1.1-.9-2-2-2s-2 .9-2 2H8c0-2.21 1.79-4 4-4s4 1.79 4 4c0 .88-.36 1.68-.93 2.25z"/>
      </svg>
      Guida
    </a>
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
    <script>
      // ── Stili pannello: iniezione robusta per vincere emotion ──
      (function injectAdminStyles() {
        console.log('[admin-style] init');
        var css = `
          /* ════════════════════════════════════════════════════════════════
             ADMIN UI — Reset totale, stile Notion / iOS / Apple
             Toni chiari, niente bordi pesanti, ombre quasi invisibili,
             spaziatura ariosa, hover sottilissimi.
             ════════════════════════════════════════════════════════════════ */

          :root {
            --bg: #F8F9FA;
            --surface: #ffffff;
            --surface-2: #f1f3f5;
            --ink: #1A1A1A;
            --ink-soft: #5A5F66;
            --ink-faint: #8A8F96;
            --line: rgba(20, 20, 20, 0.08);
            --divider: rgba(20, 20, 20, 0.12);
            --brand: #8B1A1A;
            --brand-dark: #6B0F0F;
            --brand-soft: rgba(139, 26, 26, 0.06);
            --brand-tint: rgba(139, 26, 26, 0.12);
            --shadow-card: 0 4px 12px rgba(0,0,0,0.05);
            --ease: cubic-bezier(0.22, 1, 0.36, 1);
          }


          /* TYPOGRAPHY */
          html body, html body * {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter",
                         "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
          }
          html body {
            background: var(--bg) !important;
            color: var(--ink) !important;
            letter-spacing: -0.005em;
            font-size: 14px !important;
          }
          html body h1, html body h2, html body h3, html body [class*="Heading"] {
            color: var(--ink) !important;
            letter-spacing: -0.022em !important;
          }

          /* HEADER — bianco semitrasparente, dark text */
          html body header,
          html body [class*="AppHeader"]:not([class*="Content"]):not([class*="Button"]):not([class*="Nav"]):not([class*="Actions"]) {
            background: rgba(255, 255, 255, 0.78) !important;
            -webkit-backdrop-filter: saturate(180%) blur(24px) !important;
            backdrop-filter: saturate(180%) blur(24px) !important;
            border-bottom: 1px solid var(--line) !important;
            box-shadow: none !important;
            min-height: 52px !important;
          }
          /* Centro verticalmente i contenuti del header */
          html body [class*="AppHeaderContent"] {
            display: flex !important;
            align-items: center !important;
            min-height: 52px !important;
          }
          html body [class*="AppHeaderNavList"] {
            display: flex !important;
            align-items: center !important;
            margin: 0 !important;
          }
          html body [class*="AppHeaderActions"] {
            display: flex !important;
            align-items: center !important;
          }
          /* Link Contenuti — pulito, senza chrome da bottone */
          html body header [class*="AppHeaderNavLink"],
          html body header [class*="AppHeaderButton"] {
            color: var(--ink) !important;
            font-weight: 500 !important;
            font-size: 14px !important;
            background: transparent !important;
            border: none !important;
            border-radius: 6px !important;
            padding: 6px 10px !important;
            box-shadow: none !important;
            line-height: 1 !important;
            display: inline-flex !important;
            align-items: center !important;
            gap: 6px !important;
            transition: background 0.15s var(--ease) !important;
          }
          html body header [class*="AppHeaderNavLink"]:hover,
          html body header [class*="AppHeaderButton"]:hover {
            background: rgba(55, 53, 47, 0.06) !important;
            color: var(--ink) !important;
            transform: none !important;
          }
          html body header [class*="AppHeaderNavLink"].header-link-active {
            background: transparent !important;
            color: var(--ink) !important;
            font-weight: 600 !important;
          }
          /* Avatar — niente background, niente quadrato */
          html body [class*="StyledWrapper"][class*="efqlgsg"],
          html body [class*="AvatarDropdownButton"],
          html body [class*="AvatarDropdownButton"] [class*="IconWrapper"],
          html body [class*="AvatarPlaceholderIcon"],
          html body [class*="avatarImage"] {
            background: transparent !important;
            background-color: transparent !important;
            border: none !important;
            box-shadow: none !important;
            border-radius: 999px !important;
            padding: 0 !important;
          }
          html body [class*="AvatarDropdownButton"] svg path {
            fill: var(--ink-soft) !important;
          }
          html body [class*="AvatarDropdownButton"] svg [fill] {
            fill: var(--ink-soft) !important;
          }

          /* IMPORTANTE: contenitori di LAYOUT trasparenti — niente bordo né bg */
          html body [class*="EditorContainer"],
          html body [class*="EntryFormContainer"],
          html body [class*="ControlPaneContainer"],
          html body [class*="PreviewPaneContainer"],
          html body [class*="CollectionContainer"],
          html body [class*="CollectionMainContainer"],
          html body [class*="WorkflowContainer"] {
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
            border-radius: 0 !important;
          }

          /* Header raccolta: SOLO il container esterno è una card, nient'altro
             dentro deve avere bordo/sfondo (per evitare effetto card-in-card) */
          html body [class*="CollectionTopContainer"] {
            background: var(--surface) !important;
            border: 1px solid var(--line) !important;
            border-radius: 12px !important;
            box-shadow: var(--shadow-card) !important;
            padding: 22px 26px !important;
          }
          html body [class*="CollectionTopContainer"] [class*="CollectionHeading"],
          html body [class*="CollectionTopContainer"] [class*="CollectionTopHeading"],
          html body [class*="CollectionTopContainer"] [class*="StyledCard"],
          html body [class*="CollectionTopContainer"] [class*="Card"] {
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
            padding: 0 !important;
          }
          html body [class*="CollectionTopContainer"] h1,
          html body [class*="CollectionTopContainer"] h2 {
            font-size: 24px !important;
            font-weight: 700 !important;
            letter-spacing: -0.022em !important;
            color: var(--ink) !important;
            margin: 0 !important;
          }

          /* Card single — solo entry cards visibili, non i wrapper */
          html body [class*="EntryListing"] > [class*="StyledCard"],
          html body [class*="EntryListing"] li > [class*="Card"] {
            border-radius: 10px !important;
            border: 1px solid var(--line) !important;
            background: var(--surface) !important;
            box-shadow: none !important;
          }

          /* Bottoni di visualizzazione (lista / griglia) — segmented control */
          html body [class*="ViewControls"],
          html body [class*="ViewToggle"] {
            display: inline-flex !important;
            background: var(--surface-2) !important;
            border-radius: 8px !important;
            padding: 2px !important;
            gap: 0 !important;
          }
          html body [class*="ViewControls"] button,
          html body [class*="ViewToggle"] button {
            border: none !important;
            background: transparent !important;
            border-radius: 6px !important;
            padding: 6px 10px !important;
            color: var(--ink-soft) !important;
            box-shadow: none !important;
          }
          html body [class*="ViewControls"] button[class*="active"],
          html body [class*="ViewToggle"] button[class*="active"],
          html body [class*="ViewControls"] [class*="selected"] {
            background: var(--surface) !important;
            color: var(--ink) !important;
            box-shadow: 0 1px 2px rgba(0,0,0,0.06) !important;
          }

          /* "Ordina per" pulsante */
          html body [class*="SortControl"] button,
          html body button[class*="Sort"] {
            background: transparent !important;
            border: 1px solid var(--line) !important;
            color: var(--ink-soft) !important;
            font-weight: 500 !important;
            padding: 6px 12px !important;
            border-radius: 8px !important;
          }
          html body [class*="SortControl"] button:hover,
          html body button[class*="Sort"]:hover {
            background: var(--surface-2) !important;
          }

          /* SIDEBAR "Raccolte" — card più ariosa */
          html body [class*="CollectionTop"]:not([class*="Container"]),
          html body [class*="SidebarContainer"] {
            background: var(--surface) !important;
            border-radius: 14px !important;
            border: 1px solid var(--line) !important;
            box-shadow: var(--shadow-card) !important;
            padding: 18px 14px !important;
          }
          html body [class*="CollectionTop"] h2,
          html body [class*="Sidebar"] h2 {
            font-size: 11px !important;
            font-weight: 700 !important;
            letter-spacing: 0.14em !important;
            color: var(--ink-faint) !important;
            text-transform: uppercase !important;
            padding: 4px 10px 18px !important;
            margin: 0 !important;
          }

          /* SIDEBAR ITEMS — voci più grandi, padding generoso, look dashboard */
          html body [class*="NavLink"],
          html body [class*="CollectionListItem"],
          html body a[class*="SidebarNavLink"] {
            border-radius: 10px !important;
            font-size: 15px !important;
            font-weight: 500 !important;
            color: var(--ink) !important;
            background: transparent !important;
            border: none !important;
          }
          html body [class*="NavLink"]:hover,
          html body [class*="CollectionListItem"]:hover {
            background-color: var(--surface-2) !important;
            color: var(--ink) !important;
          }
          html body [class*="NavLink"][aria-current="page"],
          html body a[class*="SidebarNavLink"][aria-current="page"] {
            background-color: var(--brand-soft) !important;
            color: var(--brand) !important;
            font-weight: 600 !important;
          }
          /* Nascondo l'icona libro-matita Decap accanto a ogni voce (rumore visivo) */
          html body [class*="CollectionListItem"] > svg:first-child,
          html body a[class*="SidebarNavLink"] > svg:first-child {
            display: none !important;
          }

          /* SEARCH input */
          html body [class*="CollectionSearch"] input,
          html body input[type="search"] {
            border: 1px solid transparent !important;
            background: var(--surface-2) !important;
            border-radius: 6px !important;
            padding: 6px 12px 6px 32px !important;
            font-size: 14px !important;
            color: var(--ink) !important;
            transition: background 0.15s var(--ease), border-color 0.15s var(--ease) !important;
          }
          html body input[type="search"]:focus {
            background: var(--surface) !important;
            border-color: var(--line) !important;
            box-shadow: 0 0 0 2px var(--brand-soft) !important;
          }

          /* INPUTS / TEXTAREA / SELECT */
          html body input[type="text"],
          html body input[type="email"],
          html body input[type="password"],
          html body input[type="number"],
          html body input[type="url"],
          html body textarea,
          html body select {
            border-radius: 6px !important;
            border: 1px solid var(--line) !important;
            background: var(--surface) !important;
            padding: 8px 12px !important;
            font-size: 14px !important;
            color: var(--ink) !important;
            transition: border-color 0.15s var(--ease), box-shadow 0.15s var(--ease) !important;
          }
          html body input:focus,
          html body textarea:focus,
          html body select:focus {
            outline: none !important;
            border-color: var(--brand) !important;
            box-shadow: 0 0 0 3px var(--brand-soft) !important;
          }

          /* BUTTONS — solo quelli "veri" con testo, non tutte le icon-button del CMS */
          html body [class*="EditorToolbar"] button,
          html body [class*="ConfirmationDialog"] button,
          html body [class*="EntryEditor"] [class*="Toolbar"] button {
            border-radius: 6px !important;
            font-weight: 500 !important;
            font-size: 14px !important;
            padding: 7px 14px !important;
            border: 1px solid var(--line) !important;
            background: var(--surface) !important;
            color: var(--ink) !important;
            box-shadow: none !important;
            transition: background 0.15s var(--ease), border-color 0.15s var(--ease) !important;
          }
          html body [class*="EditorToolbar"] button:hover,
          html body [class*="ConfirmationDialog"] button:hover {
            background: var(--surface-2) !important;
          }
          /* Le icon-button piccole dentro alle topbar lasciamole stare */
          html body [class*="ListItemTopBar"] button,
          html body [class*="TopBar"] button:not([class*="primary"]):not([class*="success"]) {
            padding: 0 !important;
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
          }

          /* BOTTONI PRIMARI rossi */
          html body [class*="primary"][class*="Button"],
          html body [class*="Button"][class*="primary"],
          html body button[class*="success"] {
            background: var(--brand) !important;
            color: #fff !important;
            border-color: transparent !important;
            box-shadow: 0 1px 2px rgba(0,0,0,0.04) !important;
          }
          html body [class*="primary"][class*="Button"]:hover,
          html body [class*="Button"][class*="primary"]:hover,
          html body button[class*="success"]:hover {
            background: var(--brand-dark) !important;
          }

          /* Entry card (es. "Dati principali") con ombra leggera — SOLO la card principale,
             niente regole su ListControl/ObjectControl/ListItemTopBar per non rompere i widget */
          html body [class*="EntryListing"] > [class*="StyledCard"],
          html body [class*="EntryListing"] [class*="ListItemContainer"] > [class*="Card"] {
            background: var(--surface) !important;
            border-radius: 12px !important;
            border: 1px solid var(--line) !important;
            box-shadow: var(--shadow-card) !important;
          }

          /* LABELS dei campi */
          html body [class*="ControlLabel"],
          html body label[class*="Label"] {
            font-weight: 500 !important;
            font-size: 13px !important;
            color: var(--ink-soft) !important;
            letter-spacing: 0 !important;
            text-transform: none !important;
          }

          /* HINTS sotto i campi */
          html body [class*="ControlHint"],
          html body [class*="FieldHint"] {
            font-size: 12.5px !important;
            color: var(--ink-faint) !important;
            margin-top: 6px !important;
          }

          /* DROPDOWN menu (es. Esci, Ordina per) */
          html body [class*="DropdownList"] {
            border-radius: 10px !important;
            border: 1px solid var(--line) !important;
            background: var(--surface) !important;
            box-shadow: 0 4px 16px rgba(0,0,0,0.08), 0 1px 3px rgba(0,0,0,0.05) !important;
            padding: 4px !important;
          }
          html body [class*="DropdownList"] [role="menuitem"],
          html body [class*="DropdownList"] [class*="dropdownItem"],
          html body [class*="StyledMenuItem"] {
            border-radius: 6px !important;
            padding: 8px 12px !important;
            font-size: 14px !important;
            transition: background 0.1s var(--ease) !important;
            cursor: pointer !important;
          }
          html body [class*="DropdownList"] [role="menuitem"]:hover,
          html body [class*="StyledMenuItem"]:hover {
            background: var(--surface-2) !important;
          }

          /* "Ordina per" link */
          html body [class*="SortControl"], html body [class*="SortButton"] {
            color: var(--ink-soft) !important;
            font-weight: 500 !important;
          }

          /* SCROLLBAR */
          ::-webkit-scrollbar { width: 10px; height: 10px; }
          ::-webkit-scrollbar-track { background: transparent; }
          ::-webkit-scrollbar-thumb {
            background: rgba(0,0,0,0.12);
            border-radius: 5px;
            border: 2px solid transparent;
            background-clip: padding-box;
          }
          ::-webkit-scrollbar-thumb:hover {
            background: rgba(0,0,0,0.22);
            background-clip: padding-box;
            border: 2px solid transparent;
          }

          /* COMPARSA dolce del contenuto principale */
          /* HIDE: solo elementi NON necessari, niente icone interne ai widget */
          html body a[href="#/media"],
          html body [class*="AppHeaderNavList"] > li:nth-child(2),
          html body input[placeholder*="Cerca su tutto"],
          html body form[role="search"] {
            display: none !important;
          }

          /* ════════════════════════════════════════════════════════════════
             MODALITÀ HOME — solo card "Raccolte" centrata e grande
             ════════════════════════════════════════════════════════════════ */
          /* In home: nascondiamo TUTTO il main e ogni elemento che non sia sidebar */
          html body.admin-home [class*="CollectionMainContainer"],
          html body.admin-home [class*="CollectionTopContainer"],
          html body.admin-home [class*="EntryListing"],
          html body.admin-home [class*="CollectionMain"],
          html body.admin-home [class*="CollectionTop"][class*="Container"],
          html body.admin-home [class*="Sort"],
          html body.admin-home [class*="View"][class*="Control"],
          html body.admin-home [class*="View"][class*="Toggle"],
          html body.admin-home [class*="EntryList"],
          html body.admin-home [class*="StyledCard"],
          html body.admin-home [class*="CollectionContainer"] > *:not([class*="SidebarContainer"]):not([class*="Sidebar"]):not([class*="CollectionTop"]:not([class*="Container"])) {
            display: none !important;
          }
          /* Fallback più diretto: tutto ciò che segue la sidebar */
          html body.admin-home [class*="SidebarContainer"] ~ * {
            display: none !important;
          }
          html body.admin-home [class*="CollectionContainer"] {
            display: flex !important;
            justify-content: center !important;
            align-items: flex-start !important;
            padding: 28px 24px 40px !important;
            height: calc(100vh - 52px) !important;
            overflow-y: auto !important;
            background: var(--bg) !important;
          }
          html body.admin-home [class*="CollectionTop"]:not([class*="Container"]),
          html body.admin-home [class*="SidebarContainer"] {
            width: min(780px, 94vw) !important;
            max-width: none !important;
            padding: 32px 32px !important;
            border-radius: 18px !important;
            box-shadow: 0 8px 32px rgba(0,0,0,0.06), 0 2px 6px rgba(0,0,0,0.04) !important;
          }
          /* Voci delle raccolte su 2 colonne: la card sta tutta nello schermo */
          html body.admin-home [class*="SidebarNavList"],
          html body.admin-home [class*="SidebarContainer"] nav,
          html body.admin-home [class*="SidebarContainer"] ul,
          html body.admin-home [class*="CollectionTop"]:not([class*="Container"]) nav,
          html body.admin-home [class*="CollectionTop"]:not([class*="Container"]) ul {
            display: grid !important;
            grid-template-columns: 1fr 1fr !important;
            gap: 8px !important;
            list-style: none !important;
            padding: 0 !important;
            margin: 0 !important;
          }
          html body.admin-home [class*="CollectionTop"] h2,
          html body.admin-home [class*="Sidebar"] h2 {
            text-align: center !important;
            font-size: 12px !important;
            letter-spacing: 0.18em !important;
            padding: 0 0 24px !important;
            color: var(--ink-faint) !important;
          }
          html body.admin-home [class*="NavLink"],
          html body.admin-home [class*="CollectionListItem"],
          html body.admin-home a[class*="SidebarNavLink"] {
            font-size: 15px !important;
            padding: 13px 16px !important;
            margin: 0 !important;
            border-radius: 12px !important;
          }

          /* TOOLBAR salva/pubblica — discreta */
          html body [class*="EditorToolbar"] {
            background: rgba(255, 255, 255, 0.85) !important;
            -webkit-backdrop-filter: saturate(180%) blur(16px) !important;
            backdrop-filter: saturate(180%) blur(16px) !important;
            border-bottom: 1px solid var(--line) !important;
            box-shadow: none !important;
          }

          /* Comparsa morbida quando cambi sezione contenuto a destra
             (NON tocchiamo la sidebar per evitare di rompere i click) */
          html body [class*="EntryListing"],
          html body [class*="CollectionTopContainer"] {
            animation: adminFadeIn 0.32s cubic-bezier(0.22, 1, 0.36, 1) both;
          }
          @keyframes adminFadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to   { opacity: 1; transform: translateY(0); }
          }
        `;

        function ensureLast() {
          var existing = document.getElementById('admin-custom-style');
          if (existing) existing.parentNode.removeChild(existing);
          var s = document.createElement('style');
          s.id = 'admin-custom-style';
          s.textContent = css;
          document.head.appendChild(s);
          console.log('[admin-style] injected, head children:', document.head.children.length);
        }

        ensureLast();

        // ── Auto-skip + body class per modalità "home" vs "editor" ──
        var SKIP_MAP = {
          'info': 'restaurant',
          'menu': 'menu',
          'team': 'team',
          'wines': 'wines',
          'theme': 'theme',
        };
        var userClickedSidebar = false;

        // Intercetta i click SOLO se partono dal DOM della sidebar
        function isInSidebar(node) {
          while (node && node !== document.body) {
            var cls = node.className || '';
            if (typeof cls === 'string' &&
                (cls.indexOf('Sidebar') !== -1 ||
                 cls.indexOf('CollectionListItem') !== -1 ||
                 cls.indexOf('CollectionTop') !== -1)) {
              return true;
            }
            node = node.parentElement;
          }
          return false;
        }
        document.addEventListener('click', function(ev) {
          var t = ev.target;
          while (t && t !== document.body) {
            if (t.tagName === 'A' && t.getAttribute('href') && t.getAttribute('href').indexOf('#/collections/') === 0) {
              if (isInSidebar(t)) {
                userClickedSidebar = true;
                // Se l'URL è già uguale al link cliccato, hashchange NON scatta
                // → forziamo l'autoSkip manualmente con un piccolo delay
                setTimeout(autoSkip, 60);
              }
              return;
            }
            t = t.parentElement;
          }

        function autoSkip() {
          updateBodyState();
          if (!userClickedSidebar) return;
          try {
            var h = window.location.hash || '';
            var m = h.match(/^#\/collections\/([^/?#]+)\/?$/);
            if (m && SKIP_MAP[m[1]]) {
              var target = '#/collections/' + m[1] + '/entries/' + SKIP_MAP[m[1]];
              userClickedSidebar = false;
              setTimeout(function() {
                if ((window.location.hash || '') === h) {
                  window.location.replace(target);
                }
              }, 80);
            }
          } catch (e) { console.warn('[auto-skip]', e); }
        }
        function updateBodyState() {
          var h = window.location.hash || '';
          var inEditor = /^#\/collections\/[^/]+\/entries\//.test(h);
          document.body.classList.toggle('admin-home', !inEditor);
          document.body.classList.toggle('admin-editor', inEditor);
        }
        setTimeout(updateBodyState, 100);
        window.addEventListener('hashchange', autoSkip);

        var TEXT_HIDE = ['Ordina per', 'Sort by', "Controlla l'anteprima", 'Check preview'];
        function hideByButtonText() {
          var btns = document.querySelectorAll('button');
          for (var i = 0; i < btns.length; i++) {
            var t = (btns[i].textContent || '').trim();
            for (var j = 0; j < TEXT_HIDE.length; j++) {
              if (t === TEXT_HIDE[j] || t.indexOf(TEXT_HIDE[j]) === 0) {
                btns[i].style.display = 'none';
              }
            }
          }
        }
        setTimeout(hideByButtonText, 400);
        setTimeout(hideByButtonText, 1200);
        setTimeout(hideByButtonText, 2500);
        window.addEventListener('hashchange', function() { setTimeout(hideByButtonText, 300); });
        // Sorveglianza permanente: ogni volta che la toolbar dell'editor cambia, ripuliamo
        var editorObs = new MutationObserver(function() { hideByButtonText(); });
        // Aspettiamo che #nc-root sia in pagina, poi osserviamo solo i suoi cambi
        var observerTimer = setInterval(function() {
          var root = document.getElementById('nc-root') || document.querySelector('[class*="App"]');
          if (root) {
            clearInterval(observerTimer);
            editorObs.observe(root, { childList: true, subtree: true });
          }
        }, 500);

        // Riposiziona sempre i nostri stili come ULTIMI in head
        var observer = new MutationObserver(function(mutations) {
          for (var i = 0; i < mutations.length; i++) {
            var added = mutations[i].addedNodes;
            for (var j = 0; j < added.length; j++) {
              if (added[j].id !== 'admin-custom-style' &&

                return;

        observer.observe(document.head, { childList: true });

                  if (!url) return null;
                  var a = getAsset ? getAsset(url) : url;
                  return h('img', { key: i, src: a && a.toString ? a.toString() : a, style: { width: '100%', borderRadius: 6, aspectRatio: '2/3', objectFit: 'cover' }, alt: '' });
                })
              )
            )
          );
        }
      });
      CMS.registerPreviewTemplate('events', EventsPreview);

      // ── Anteprima INTRATTENIMENTI & SPAZI ────────────────────────────────
      var VenuePreview = createClass({
        render: function() {
          var data = this.props.entry.get('data');
          var spaces = data.get('spaces');
          var accent = getTheme().colorAccent;
          return h('div', {},
            h('div', { className: 'eyebrow' }, data.get('eyebrow') || 'Intrattenimenti'),
            h('h1', {}, data.get('title') || 'Spazi & divertimento'),
            data.get('intro') && h('p', { style: { marginBottom: '1rem' } }, data.get('intro')),
            spaces && spaces.map(function(s, i) {
              return h('div', { key: i, className: 'card' },
                h('h3', {}, s.get('title') || '—'),
                h('p', {}, s.get('text') || ''),
                s.get('link') && h('p', { style: { color: accent, fontWeight: 600, fontSize: '0.82rem', marginTop: 4 } }, '🔗 ' + s.get('link'))
              );
            })
          );
        }
      });
      CMS.registerPreviewTemplate('venue', VenuePreview);

      // ── Anteprima TESTI DELLA HOME ───────────────────────────────────────
      var HomeTextPreview = createClass({
        render: function() {
          var data = this.props.entry.get('data');
          function blk(label, obj, fields) {
            if (!obj) return null;
            return h('div', { className: 'card' },
              h('div', { className: 'eyebrow' }, label),
              fields.map(function(f, i) {
                var v = obj.get(f.key);
                if (!v) return null;
                return h('p', { key: i }, h('strong', {}, f.lbl + ': '), v);
              })
            );
          }
          return h('div', {},
            h('h1', {}, 'Testi della Home'),
            blk('Prima schermata', data.get('hero'), [{ key: 'eyebrow', lbl: 'Etichetta' }, { key: 'lead', lbl: 'Frase' }, { key: 'hoursLine', lbl: 'Orari' }]),
            blk('Manifesto', data.get('manifesto'), [{ key: 'eyebrow', lbl: 'Etichetta' }, { key: 'title', lbl: 'Titolo' }, { key: 'tags', lbl: 'Riga' }]),
            blk('Pizze', data.get('pizze'), [{ key: 'eyebrow', lbl: 'Etichetta' }, { key: 'title', lbl: 'Titolo' }]),
            blk('Birreria', data.get('birreria'), [{ key: 'eyebrow', lbl: 'Etichetta' }, { key: 'title', lbl: 'Titolo' }, { key: 'text', lbl: 'Testo' }]),
            blk('Le anime', data.get('anime'), [{ key: 'eyebrow', lbl: 'Etichetta' }, { key: 'title', lbl: 'Titolo' }]),
            blk('Musica dal vivo', data.get('eventi'), [{ key: 'eyebrow', lbl: 'Etichetta' }, { key: 'title', lbl: 'Titolo' }]),
            blk('Fascia finale', data.get('cta'), [{ key: 'title', lbl: 'Titolo' }])
          );
        }
      });
      CMS.registerPreviewTemplate('home', HomeTextPreview);
    </script>
  </body>
</html>
