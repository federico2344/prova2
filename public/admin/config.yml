backend:
  name: git-gateway
  branch: main

media_folder: "public/images"
public_folder: "/images"

locale: "it"
logo_url: /images/general/logo-nav.png

collections:

  # ---------------------------------------------------------------------------
  # 1) INFORMAZIONI RISTORANTE
  # ---------------------------------------------------------------------------
  - name: "info"
    label: "Informazioni Ristorante"
    description: "Nome, contatti, orari, social, dati legali e foto in cima alla home. Compaiono nell'intestazione, nella home, nel footer e nella pagina Contatti."
    files:
      - name: "restaurant"
        label: "Dati principali"
        file: "src/content/restaurant.json"
        fields:
          - { name: "name", label: "Nome ristorante", widget: "string", required: true }
          - { name: "tagline", label: "Tagline (sotto il nome)", widget: "string", required: true }
          - { name: "intro", label: "Testo introduttivo (home)", widget: "text", required: true }
          - { name: "phone", label: "Telefono (es. +39 06 3031 0097)", widget: "string", required: true }
          - name: "email"
            label: "Email (opzionale)"
            widget: "string"
            required: false
            pattern: ['^$|^[^\s@]+@[^\s@]+\.[^\s@]+$', "Lascia vuoto o inserisci un'email valida"]
          - name: "address"
            label: "Indirizzo"
            widget: "object"
            collapsed: true
            summary: "{{street}} — {{city}}"
            fields:
              - { name: "street", label: "Via e numero civico", widget: "string", required: true }
              - { name: "city", label: "CAP e città", widget: "string", required: true }
              - name: "mapsUrl"
                label: "Link Google Maps"
                widget: "string"
                required: false
                pattern: ['^https://.+', "Deve iniziare con https://"]
          - name: "hours"
            label: "Orari di apertura"
            label_singular: "Fascia oraria"
            widget: "list"
            collapsed: true
            summary: "{{day}}"
            min: 1
            fields:
              - { name: "day", label: "Giorni (es. Martedì – Domenica)", widget: "string", required: true }
              - { name: "lunch", label: "Orario pranzo (opzionale, es. 12:30 – 15:00)", widget: "string", required: false }
              - { name: "dinner", label: "Orario serale (es. 19:00 – 02:30)", widget: "string", required: false }
              - { name: "closed", label: "Giorno di chiusura", widget: "boolean", default: false, required: false }
          - name: "social"
            label: "Social"
            widget: "object"
            collapsed: true
            fields:
              - name: "instagram"
                label: "Link Instagram"
                widget: "string"
                required: false
                pattern: ['^https://(www\.)?instagram\.com/.+', "Deve essere un link Instagram (es. https://www.instagram.com/locandablues/)"]
              - name: "facebook"
                label: "Link Facebook"
                widget: "string"
                required: false
                pattern: ['^https://(www\.)?facebook\.com/.+', "Deve essere un link Facebook (es. https://www.facebook.com/locandablues)"]
          - name: "legal"
            label: "Dati aziendali (obbligo di legge)"
            widget: "object"
            hint: "Dati che per legge devono apparire nel footer del sito (D.Lgs. 70/2003)."
            collapsed: true
            fields:
              - { name: "companyName", label: "Ragione sociale", widget: "string", required: false }
              - { name: "vatNumber", label: "Partita IVA", widget: "string", required: false }
              - { name: "fiscalCode", label: "Codice fiscale", widget: "string", required: false }
              - { name: "legalAddress", label: "Sede legale", widget: "string", required: false }
              - { name: "pec", label: "Email PEC", widget: "string", required: false }
          - name: "heroImage"
            label: "Foto in cima alla home (prima schermata)"
            widget: "image"
            required: false
            hint: "È la grande foto in cima alla home, accanto al titolo. Consigliata orizzontale e ben illuminata."
            media_folder: "/public/images/hero"
            public_folder: "/images/hero"

  # ---------------------------------------------------------------------------
  # 2) MENÙ
  # ---------------------------------------------------------------------------
  - name: "menu"
    label: "Menù"
    description: "I piatti della pagina 'Cucina & Pizza' (/menu) e le pizze in evidenza nella home."
    files:
      - name: "menu"
        label: "Categorie del menù"
        file: "src/content/menu.json"
        fields:
          - name: "categories"
            label: "Categorie"
            label_singular: "Categoria"
            widget: "list"
            collapsed: true
            summary: "{{title}}"
            hint: "Trascina le categorie per riordinarle. L'ordine qui = l'ordine dei tab sul sito."
            min: 1
            max: 10
            fields:
              - { name: "id", widget: "hidden" }
              - { name: "title", label: "Titolo tab", widget: "string", required: true }
              - { name: "description", label: "Descrizione", widget: "text", required: false }
              - name: "sections"
                label: "Sezioni"
                label_singular: "Sezione"
                widget: "list"
                collapsed: true
                summary: "{{title}}"
                min: 1
                fields:
                  - { name: "title", label: "Titolo sezione (es. Antipasti)", widget: "string", required: false }
                  - { name: "note", label: "Nota sotto il titolo", widget: "string", required: false }
                  - { name: "fixedPrice", label: "Prezzo fisso €/persona (solo menù fissi)", widget: "number", required: false, value_type: "float" }
                  - name: "dishes"
                    label: "Piatti"
                    label_singular: "Piatto"
                    widget: "list"
                    collapsed: true
                    summary: "{{name}} — €{{price}}"
                    hint: "Trascina i piatti per riordinarli."
                    fields:
                      - { name: "name", label: "Nome piatto", widget: "string", required: true }
                      - { name: "description", label: "Descrizione", widget: "text", required: false }
                      - { name: "price", label: "Prezzo € (lascia vuoto se incluso nel menù fisso)", widget: "number", required: false, value_type: "float" }

  # ---------------------------------------------------------------------------
  # 3) TEAM
  # ---------------------------------------------------------------------------
  - name: "team"
    label: "Le anime del locale"
    description: "Le tre 'anime' (Cucina, Birreria, Live) mostrate nella home e nella pagina 'Il Locale'."
    files:
      - name: "team"
        label: "Le anime del locale"
        file: "src/content/team.json"
        fields:
          - name: "people"
            label: "Sezioni"
            label_singular: "Sezione"
            widget: "list"
            collapsed: true
            summary: "{{name}} — {{role}}"
            hint: "Trascina per riordinare. L'ordine qui = l'ordine sulla pagina del sito."
            min: 1
            fields:
              - { name: "role", label: "Etichetta (es. Cucina & Pizzeria)", widget: "string", required: true }
              - { name: "name", label: "Titolo (es. Il Forno a Legna)", widget: "string", required: true }
              - { name: "text", label: "Descrizione", widget: "text", required: true }
              - name: "photo"
                label: "Foto"
                widget: "image"
                required: false
                hint: "Consigliato: foto rappresentativa, ben illuminata."
                media_folder: "/public/images/team"
                public_folder: "/images/team"

  # ---------------------------------------------------------------------------
  # INTRATTENIMENTI & SPAZI (mostrati nella pagina "Il Locale")
  # ---------------------------------------------------------------------------
  - name: "venue"
    label: "Intrattenimenti & Spazi"
    description: "Gli spazi del locale (Live Club, Studio 12.84, Vineria, Sala Chalet, ecc.) mostrati nella pagina 'Il Locale'."
    files:
      - name: "venue"
        label: "Spazi del locale"
        file: "src/content/venue.json"
        fields:
          - { name: "eyebrow", label: "Etichetta (timbro)", widget: "string", required: false }
          - { name: "title", label: "Titolo della sezione", widget: "string", required: false }
          - { name: "intro", label: "Testo introduttivo", widget: "text", required: false }
          - name: "spaces"
            label: "Spazi"
            label_singular: "Spazio"
            widget: "list"
            collapsed: true
            summary: "{{title}}"
            min: 1
            fields:
              - { name: "title", label: "Titolo (es. Live Club)", widget: "string", required: true }
              - { name: "text", label: "Descrizione", widget: "text", required: true }
              - { name: "link", label: "Link (opzionale, es. pagina Facebook)", widget: "string", required: false, pattern: ['^$|^https?://.+', "Lascia vuoto o inserisci un link che inizia con http"] }

  # ---------------------------------------------------------------------------
  # 4) CARTA DEI VINI
  # ---------------------------------------------------------------------------
  - name: "wines"
    label: "Birreria & Drink"
    description: "Birre, cocktail, vini e distillati della pagina 'Birreria' (/vini)."
    files:
      - name: "wines"
        label: "Birre, drink e vini"
        file: "src/content/wines.json"
        fields:
          - { name: "intro", label: "Testo introduttivo", widget: "text", required: true }
          - name: "sections"
            label: "Categorie"
            label_singular: "Categoria"
            widget: "list"
            collapsed: true
            summary: "{{title}}"
            min: 1
            fields:
              - { name: "id", widget: "hidden" }
              - { name: "title", label: "Titolo categoria (es. Birre alla Spina)", widget: "string", required: true }
              - name: "items"
                label: "Voci"
                label_singular: "Voce"
                widget: "list"
                required: false
                collapsed: true
                summary: "{{name}} — €{{price}}"
                fields:
                  - { name: "name", label: "Nome", widget: "string", required: true }
                  - { name: "description", label: "Descrizione (stile, gradazione, formato…)", widget: "string", required: false }
                  - { name: "price", label: "Prezzo € (lascia vuoto se non applicabile)", widget: "number", required: false, value_type: "float" }
              - name: "subsections"
                label: "Sottocategorie (es. IPA, Cocktail…)"
                label_singular: "Sottocategoria"
                widget: "list"
                required: false
                collapsed: true
                summary: "{{title}}"
                fields:
                  - { name: "title", label: "Titolo (es. IPA — 33cl)", widget: "string", required: true }
                  - name: "items"
                    label: "Voci"
                    label_singular: "Voce"
                    widget: "list"
                    collapsed: true
                    summary: "{{name}} — €{{price}}"
                    fields:
                      - { name: "name", label: "Nome", widget: "string", required: true }
                      - { name: "description", label: "Descrizione", widget: "string", required: false }
                      - { name: "price", label: "Prezzo € (lascia vuoto se non applicabile)", widget: "number", required: false, value_type: "float" }

  # ---------------------------------------------------------------------------
  # 5) EVENTI & LIVE
  # ---------------------------------------------------------------------------
  - name: "events"
    label: "Eventi & Live"
    description: "Concerti e locandine della sezione 'Musica dal vivo' nella home."
    files:
      - name: "events"
        label: "Programmazione live"
        file: "src/content/events.json"
        fields:
          - { name: "intro", label: "Testo introduttivo (sezione Live)", widget: "text", required: false }
          - name: "upcoming"
            label: "Prossimi live"
            label_singular: "Evento"
            widget: "list"
            collapsed: true
            summary: "{{day}} {{date}} {{month}} — {{title}}"
            required: false
            hint: "Trascina per riordinare. Il primo evento compare anche nella barra in alto e nella home."
            fields:
              - { name: "day", label: "Giorno (es. Ven)", widget: "string", required: true }
              - { name: "date", label: "Numero del giorno (es. 12)", widget: "string", required: true }
              - { name: "month", label: "Mese (es. Giu)", widget: "string", required: true }
              - { name: "title", label: "Nome band / serata", widget: "string", required: true }
              - { name: "genre", label: "Genere o descrizione", widget: "string", required: false }
              - { name: "time", label: "Orario (es. Live 22:00)", widget: "string", required: false }
              - name: "poster"
                label: "Locandina (opzionale)"
                widget: "image"
                required: false
                media_folder: "/public/images/events"
                public_folder: "/images/events"
          - name: "posters"
            label: "Muro di locandine (home)"
            label_singular: "Locandina"
            widget: "list"
            required: false
            hint: "Le locandine mostrate nella sezione Live della home."
            field:
              name: "src"
              label: "Locandina"
              widget: "image"
              media_folder: "/public/images/events"
              public_folder: "/images/events"

  # ---------------------------------------------------------------------------
  # TESTI DELLA HOME (titoli e frasi delle sezioni della homepage)
  # ---------------------------------------------------------------------------
  - name: "hometext"
    label: "Testi della Home"
    description: "Titoli e frasi delle varie sezioni della pagina iniziale (home)."
    files:
      - name: "home"
        label: "Titoli e testi delle sezioni"
        file: "src/content/home.json"
        fields:
          - name: "hero"
            label: "Prima schermata (in cima alla home)"
            widget: "object"
            fields:
              - { name: "eyebrow", label: "Etichetta sopra il titolo", widget: "string", required: false }
              - { name: "lead", label: "Frase descrittiva", widget: "text", required: false }
              - { name: "hoursLine", label: "Riga orari (es. Aperti dalle 19:00)", widget: "string", required: false }
          - name: "manifesto"
            label: "Manifesto (sotto la hero)"
            widget: "object"
            fields:
              - { name: "eyebrow", label: "Etichetta", widget: "string", required: false }
              - { name: "title", label: "Frase principale", widget: "text", required: false }
              - { name: "tags", label: "Riga con i puntini (es. Forno a legna · Birre alla spina · Live)", widget: "string", required: false }
          - name: "pizze"
            label: "Sezione Pizze (dal forno a legna)"
            widget: "object"
            fields:
              - { name: "eyebrow", label: "Etichetta", widget: "string", required: false }
              - { name: "title", label: "Titolo", widget: "string", required: false }
          - name: "birreria"
            label: "Sezione Birreria"
            widget: "object"
            fields:
              - { name: "eyebrow", label: "Etichetta", widget: "string", required: false }
              - { name: "title", label: "Titolo", widget: "string", required: false }
              - { name: "text", label: "Testo", widget: "text", required: false }
          - name: "anime"
            label: "Sezione Le anime del locale"
            widget: "object"
            fields:
              - { name: "eyebrow", label: "Etichetta", widget: "string", required: false }
              - { name: "title", label: "Titolo", widget: "string", required: false }
          - name: "eventi"
            label: "Sezione Musica dal vivo"
            widget: "object"
            fields:
              - { name: "eyebrow", label: "Etichetta", widget: "string", required: false }
              - { name: "title", label: "Titolo", widget: "string", required: false }
          - name: "cta"
            label: "Fascia finale (CTA)"
            widget: "object"
            fields:
              - { name: "title", label: "Titolo", widget: "string", required: false }

  # ---------------------------------------------------------------------------
  # TEMA DEL SITO (colori e font)
  # ---------------------------------------------------------------------------
  - name: "theme"
    label: "Tema del sito"
    description: "Colori e font usati in tutto il sito (con anteprima live)."
    files:
      - name: "theme"
        label: "Colori e Font"
        file: "src/content/theme.json"
        fields:
          - { name: "colorBrand", label: "Colore principale (bottoni, accenti)", widget: "color", default: "#6E1A1A" }
          - { name: "colorAccent", label: "Colore accento (badge, eyebrow)", widget: "color", default: "#C8902F" }
          - { name: "colorPrice", label: "Colore dei prezzi (menù e drink)", widget: "color", default: "#A8701C" }
          - { name: "colorBackground", label: "Colore sfondo", widget: "color", default: "#F4EAD7" }
          - { name: "colorText", label: "Colore testo principale", widget: "color", default: "#271511" }
          - name: "fontDisplay"
            label: "Font dei titoli"
            widget: "select"
            default: "Bitter"
            options:
              - "Bitter"
              - "Playfair Display"
              - "Cormorant Garamond"
              - "DM Serif Display"
          - name: "fontBody"
            label: "Font del corpo del testo"
            widget: "select"
            default: "Inter"
            options:
              - "Inter"
              - "Manrope"
              - "Lora"
